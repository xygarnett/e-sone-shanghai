name: Deploy E-sone website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Select static-only hosting configuration
        run: |
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("vite.config.ts", "import { defineConfig } from \"vite\"; import vinext from \"vinext\"; export default defineConfig({ plugins: [vinext()] });");'
      - name: Build static website
        env:
          NEXT_PUBLIC_BASE_PATH: /e-sone-shanghai
        run: |
          pnpm build
          test -f dist/client/index.html
          touch dist/client/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
